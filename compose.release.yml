name: mewhelp-delivery

x-app: &app
  image: mewhelp:local
  build: .
  env_file: ${MEWHELP_ENV_FILE:-.env}
  environment:
    DATABASE_URL: "mysql+asyncmy://mewhelp:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/mewhelp"
    MYSQL_ROOT_PASSWORD: ""
    MINIO_PASSWORD: ""
    MILVUS_URI: http://milvus:19530
    CHECKPOINTER_DB_PATH: data/session/checkpoints.sqlite
    MCP_LOGISTICS_URL: http://logistics:8101/mcp
    MCP_AFTERSALES_URL: http://aftersales:8102/mcp
  depends_on:
    mysql:
      condition: service_healthy
    milvus:
      condition: service_healthy

x-mcp: &mcp
  image: mewhelp:local
  build: .
  environment:
    MCP_BIND_HOST: 0.0.0.0
  restart: unless-stopped

services:
  app:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
      logistics:
        condition: service_healthy
      aftersales:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    volumes:
      - session-data:/srv/mewhelp/data/session
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=5).close()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  kb-init:
    <<: *app
    profiles: ["tools"]
    command: ["sh", "-ec", "python -m scripts.build_kb && python -m scripts.vectorize_kb"]

  logistics:
    <<: *mcp
    command: ["python", "-m", "mcp_servers.logistics_server"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8101), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  aftersales:
    <<: *mcp
    command: ["python", "-m", "mcp_servers.aftersales_server"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8102), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mewhelp
      MYSQL_USER: mewhelp
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u mewhelp mewhelp -e 'SELECT 1 FROM conversations LIMIT 1'"]
      interval: 5s
      timeout: 4s
      retries: 25
      start_period: 20s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd", "--auto-compaction-retention=1h"]
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: milvusdb/minio:RELEASE.2024-05-28T17-19-04Z
    command: ["server", "/minio_data"]
    environment:
      MINIO_ROOT_USER: mewhelp
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.22
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: mewhelp
      MINIO_SECRET_ACCESS_KEY: "${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
  session-data:
